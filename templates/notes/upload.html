{% extends "base.html" %}{% block content %}<div class="card" style="max-width:720px;margin:auto"><h1>Upload Notes</h1><p class="muted">Subject and module are used for your analytics.</p>{% if error %}<div class="error">{{ error }}</div>{% endif %}<form method="post" enctype="multipart/form-data">{% csrf_token %}<div class="form-row"><label>Title</label><input name="title" placeholder="Operating Systems Unit 1" required></div><div class="form-row"><label>Subject</label><input name="subject" placeholder="Operating Systems" required></div><div class="form-row"><label>Unit / Module</label><input name="module" placeholder="Unit 1" required></div><div class="form-row"><label>PDF</label><input type="file" name="pdf" accept=".pdf,application/pdf" required></div><button class="btn">Upload PDF →</button></form></div>{% endblock %}
