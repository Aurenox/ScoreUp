{% extends "base.html" %}{% block content %}<div style="display:flex;justify-content:space-between;align-items:center"><div><h1>My Notes</h1><p class="muted">Unlimited practice from your notes.</p></div><a class="btn" href="{% url 'upload_note' %}">+ Upload</a></div><div class="grid">{% for note in notes %}<div class="card"><span class="pill">{{ note.subject }}</span><h2>{{ note.title }}</h2><p class="muted">{{ note.module }}</p><a class="btn secondary" href="{% url 'note_detail' note.pk %}">Open →</a></div>{% empty %}<div class="card"><h3>No notes yet</h3></div>{% endfor %}</div>{% endblock %}
