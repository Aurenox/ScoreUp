
{% load static %}
<!doctype html>
<html>
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>{% block title %}ScoreUp{% endblock %}</title>
<link rel="stylesheet" href="{% static 'style.css' %}">
</head>
<body>
<nav class="nav">
  <a class="brand" href="/">ScoreUp</a>
  <div class="navlinks">
    {% if user.is_authenticated %}
      <a href="{% url 'dashboard' %}">Dashboard</a>

      <a href="{% url 'note_list' %}">Notes</a>
      <a href="{% url 'upload_note' %}">Upload</a>
<form method="post" action="{% url 'logout' %}" style="display:inline;">
    {% csrf_token %}
    <button type="submit" class="nav-logout btn">
      Logout
    </button>
  </form>
    {% else %}
      <a href="{% url 'login' %}">Login</a>
      <a class="btn" href="{% url 'register' %}">Get Started</a>
    {% endif %}
  </div>
</nav>
<main class="container">{% block content %}{% endblock %}</main>
<footer class="footer">ScoreUp · Practice Better. Score Better.</footer>
</body>
</html>
